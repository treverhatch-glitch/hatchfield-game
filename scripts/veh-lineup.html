<!doctype html>
<html><head><meta charset="utf-8"><title>Vehicle lineup</title>
<style>html,body{margin:0;background:#cfd9e2;font-family:Inter,Arial,sans-serif}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three'
import { ALL_MODELS, MODEL_SIZE, vehicleRig, poseVehicleRig } from '/src/render/vehicles.ts'
const Q = new URLSearchParams(location.search)
const NIGHT = Q.get('night') === '1'
const EXT = Number(Q.get('ext') ?? 0)
const CLOCK = Number(Q.get('t') ?? 1.2)
const KIND = { fuel_tanker:'fuel', hydrant_cart:'hydrant', baggage_train:'bags', baggage_cart:'cart', belt_loader:'belt_loader', catering_hilift:'catering', arff:'fire', deice:'deice', apron_bus:'termbus', coach:'coach', box_truck:'citycargo', van:'delivery', towbar_tug:'tow', towbarless_tug:'pushback_tug', gpu:'gpu', stairs:'stairs', k_loader:'cargo', uld_dolly:'dolly' }
const ids = ALL_MODELS
const cols = 6, cw = 400, ch = 320
const W = cols * cw, H = Math.ceil(ids.length / cols) * ch
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
r.setSize(W, H); r.setScissorTest(true); r.outputColorSpace = THREE.SRGBColorSpace
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap
document.body.appendChild(r.domElement)
const label = document.createElement('canvas'); label.width = W; label.height = H
label.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none'; document.body.appendChild(label)
const lx = label.getContext('2d')
ids.forEach((id, i) => {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(NIGHT ? '#0d1524' : i % 2 ? '#d6e0e8' : '#cbd6df')
  scene.add(new THREE.HemisphereLight(0xeaf2ff, 0x6b6253, NIGHT ? 0.25 : 1.5))
  const key = new THREE.DirectionalLight(0xfff1dc, NIGHT ? 0.2 : 2.6); key.position.set(-6, 12, 9); key.castShadow = true
  key.shadow.camera.left = key.shadow.camera.bottom = -9; key.shadow.camera.right = key.shadow.camera.top = 9; key.shadow.mapSize.set(1024, 1024)
  scene.add(key)
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: '#8b9096' }))
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground)
  const m = vehicleRig(KIND[id], '#2f7fd0'); m.traverse(o => { if (o.isMesh) { o.castShadow = true } }); poseVehicleRig(m, id, EXT, CLOCK, EXT > 0); scene.add(m)
  const [L, Hh] = MODEL_SIZE[id]
  const cam = new THREE.PerspectiveCamera(30, cw / (ch - 36), 0.1, 200)
  const rad = Math.hypot(L, Hh + EXT * 2.4) / 2 + 0.6 + (EXT > 0 ? 1.2 : 0)
  const dist = rad / Math.sin(THREE.MathUtils.degToRad(15))
  cam.position.set(dist * 0.62, dist * 0.42, dist * 0.66); cam.lookAt(0, Hh * 0.4, 0)
  const x = (i % cols) * cw, y = Math.floor(i / cols) * ch
  r.setViewport(x, H - y - ch, cw, ch - 36); r.setScissor(x, H - y - ch, cw, ch)
  r.setClearColor(scene.background); r.render(scene, cam)
  lx.fillStyle = '#1b2430'; lx.font = 'bold 18px Arial'; lx.fillText(`${id}  (${MODEL_SIZE[id].join(' × ')} m)`, x + 12, y + 24)
})
window.__done = true
</script></body></html>
