name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - name: World consistency
        run: npx vitest run src/game/worldRules.test.ts tests/sim/worldConsistency.test.ts
      - name: Scripted auditor checks
        run: npx vitest run -c tests/scripted-playthrough/vitest.config.mts
      - run: npm run build
